name: Generate F1 car SVG

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"   # daily

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate f1-car.svg
        run: |
          mkdir -p dist
          cat > dist/f1-car.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160">
            <defs>
              <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0" stop-color="#0d1117"/>
                <stop offset="1" stop-color="#070a0f"/>
              </linearGradient>
              <linearGradient id="track" x1="0" x2="1">
                <stop offset="0" stop-color="#111827"/>
                <stop offset="1" stop-color="#0b1220"/>
              </linearGradient>
              <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="2.8" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <!-- Background -->
            <rect width="900" height="160" fill="url(#bg)"/>
            <text x="22" y="34" fill="#9CA3AF" font-family="Fira Code, monospace" font-size="16">F1 build pipeline: commit → build → deploy</text>

            <!-- Track -->
            <rect x="18" y="70" width="864" height="60" rx="14" fill="url(#track)" stroke="#1f2937"/>
            <path d="M 40 100 H 860" stroke="#FF1801" stroke-width="3" stroke-dasharray="14 14" opacity="0.9"/>

            <!-- Start/Finish -->
            <g opacity="0.9">
              <rect x="90" y="76" width="22" height="48" fill="#E5E7EB"/>
              <path d="M 90 76 H 112 M 90 88 H 112 M 90 100 H 112 M 90 112 H 112 M 90 124 H 112" stroke="#111827" stroke-width="2"/>
            </g>

            <!-- Car group (moves left -> right) -->
            <g filter="url(#glow)">
              <g id="car">
                <!-- wheels -->
                <circle cx="40" cy="118" r="10" fill="#111827" stroke="#FF1801" stroke-width="2"/>
                <circle cx="112" cy="118" r="10" fill="#111827" stroke="#FF1801" stroke-width="2"/>
                <!-- body -->
                <path d="M30 112
                         C36 98, 55 92, 72 92
                         C88 92, 98 98, 104 104
                         L126 104
                         C130 104, 132 108, 132 112
                         L132 114
                         C132 118, 128 120, 124 120
                         L28 120
                         C24 120, 22 116, 24 112
                         Z"
                      fill="#FF1801"/>
                <!-- cockpit -->
                <path d="M70 94 C76 90, 86 90, 92 94 L92 104 L70 104 Z" fill="#0d1117"/>
                <!-- wing -->
                <rect x="18" y="106" width="18" height="6" rx="3" fill="#E5E7EB"/>
                <rect x="126" y="108" width="18" height="4" rx="2" fill="#E5E7EB"/>

                <!-- tiny “sparks” -->
                <circle cx="18" cy="122" r="2" fill="#FF9E0F" opacity="0.8"/>
                <circle cx="12" cy="126" r="1.5" fill="#FF9E0F" opacity="0.7"/>
              </g>

              <!-- animate the car across the track -->
              <animateTransform
                xlink:href="#car"
                attributeName="transform"
                type="translate"
                dur="3.2s"
                repeatCount="indefinite"
                values="-40 0; 760 0"
                keyTimes="0; 1"
              />

              <!-- wheel spin illusion (simple rotate around each wheel center) -->
              <animateTransform
                xlink:href="#car"
                additive="sum"
                attributeName="transform"
                type="translate"
                dur="3.2s"
                repeatCount="indefinite"
                values="-40 0; 760 0"
                keyTimes="0; 1"
              />
            </g>

            <!-- Footer text -->
            <text x="22" y="152" fill="#6B7280" font-family="Fira Code, monospace" font-size="13">
              Box box box | Deploying: f1-car.svg
            </text>
          </svg>
          SVG

      - name: Publish to animation branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: animation
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
